spring:
  datasource:
    url: jdbc:h2:mem:managementdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        show_sql: true

management:
  tracing:
    enabled: false
  metrics:
    export:
      prometheus:
        enabled: false
  zipkin:
    tracing:
      endpoint: # Disabled in dev

